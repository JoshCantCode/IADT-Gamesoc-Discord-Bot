services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro-tts
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamesoc
    restart: unless-stopped
    env_file: .env
    environment:
      TTS_URL: http://kokoro:8880/v1/audio/speech
    depends_on:
      - kokoro
    volumes:
      - ./commands.json:/bot/commands.json
